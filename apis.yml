aid: auditoria
name: Auditoria.AI
description: >-
  Auditoria.AI is a San Jose, California software company, founded in 2019, that builds
  agentic AI "SmartBots" for the corporate finance back office. Its SmartVendor line
  (AP Helpdesk, AP Invoices, AP Accruals) and SmartCustomer line (AR Helpdesk, AR
  Collections, AR Remittances), together with SmartResearch and the Guardian data-protection
  layer, automate vendor onboarding and management, invoice capture and validation, accruals,
  collections, remittance application and audit readiness on top of a customer's existing ERP.
  The platform runs a finance-domain small language model over structured ERP records and
  unstructured invoices, remittances, emails and supplier documents, and executes work as
  configurable SmartFlow Skills / Agent Co-workers with human-in-the-loop review. Auditoria
  integrates into Workday, Oracle NetSuite, Oracle Fusion Cloud Financials, SAP, Sage Intacct,
  Coupa and ServiceNow, with a template-driven Universal Connector over SFTP or Amazon S3 for
  ERPs that have no native connector. Auditoria is an API consumer rather than an API provider -
  it publishes no public developer API, SDK, webhook surface or developer portal.
